name: Autofix

# Auto-fix formatting (ktlint CLI, pinned version) and commit the result.
# Runs on every push to main, on demand, and weekly. The autofix commit
# carries [skip ci] so it does not re-trigger CI - the next real push is
# validated against the formatted code anyway.
permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: ktlint format + commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Download ktlint (pinned)
        run: |
          KTLINT_VERSION=1.3.1
          curl -fsSL -o ktlint \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x ktlint
          ./ktlint --version

      - name: Apply ktlint format
        # A parse-level failure on one file must not block formatting of the
        # rest; the CI build is the authority on compilability.
        run: ./ktlint --format "app/src/**/*.kt" || true

      - name: Commit and push fixes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "rockedit-autofix[bot]"
            git config user.email "autofix@rockedit.local"
            git add -A
            git commit -m "style: ktlint autofix [skip ci]"
            git push
            echo "Autofix commit pushed."
          else
            echo "No formatting changes to commit."
          fi
