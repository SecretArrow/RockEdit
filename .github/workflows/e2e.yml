name: E2E

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Instrumented E2E (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build debug APKs (app + androidTest)
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --parallel --stacktrace

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            sleep 5
            ./gradlew --no-daemon :app:connectedDebugAndroidTest --stacktrace || {
              echo ">> tests failed - dumping diagnostics"
              adb shell dumpsys window windows | head -80 || true
              adb logcat -d > /tmp/e2e-logcat.txt || true
              exit 1
            }

      - name: Auto-retry flaky run once
        if: failure() && github.run_attempt < 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run rerun ${{ github.run_id }} --failed

      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-diagnostics
          path: |
            /tmp/e2e-logcat.txt
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7
