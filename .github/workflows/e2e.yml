name: E2E

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Instrumented E2E (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable KVM group perms (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build debug APKs (app + androidTest)
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --parallel --stacktrace

      - name: Run instrumented tests on emulator (with in-job retry)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            sleep 3
            set +e
            for attempt in 1 2 3; do
              echo ">> connectedDebugAndroidTest - attempt $attempt"
              ./gradlew --no-daemon :app:connectedDebugAndroidTest --stacktrace
              if [ $? -eq 0 ]; then
                echo ">> e2e green on attempt $attempt"
                exit 0
              fi
              echo ">> attempt $attempt failed; restarting test state"
              adb shell pm clear com.secretarrow.rockedit || true
              sleep 5
            done
            echo ">> e2e failed after 3 attempts - dumping diagnostics"
            adb shell dumpsys window windows | head -60 || true
            adb logcat -d > /tmp/e2e-logcat.txt || true
            exit 1

      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-diagnostics
          path: |
            /tmp/e2e-logcat.txt
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7
