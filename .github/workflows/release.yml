name: Release

# Auto-release: push a tag `vX.Y.Z` to build a signed APK and publish a GitHub Release.
permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release + publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Compute version from git
        id: ver
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Release: versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Build signed release APK
        run: |
          ./gradlew --no-daemon :app:assembleRelease --parallel --stacktrace \
            -ProckeditVersionCode=${{ steps.ver.outputs.version_code }} \
            -ProckeditVersionName=${{ steps.ver.outputs.version_name }}

      - name: Generate SHA256SUMS
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Rock Edit ${{ steps.ver.outputs.version_name }}
          generate_release_notes: true
          body: |
            ## Rock Edit ${{ steps.ver.outputs.version_name }}

            Editor teks & kode cepat untuk Android — **100% gratis dan bebas (GPL-3.0)**, tanpa iklan, tanpa telemetri, tanpa izin berbahaya.

            ### Instalasi
            1. Unduh `app-release.apk` di bawah.
            2. Verifikasi checksum dengan `SHA256SUMS.txt` bila memunginkan.
            3. Instal (izinkan instalasi dari sumber ini bila diminta).

            ### Lisensi & Privasi
            - Kode sumber: GPL-3.0 — https://github.com/SecretArrow/RockEdit
            - Tidak ada data yang meninggalkan perangkat Anda. Tanpa izin internet pada versi ini.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
