# Project-wide Gradle settings for Rock Edit.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Public FOSS signing keystore (committed intentionally for reproducible auto-release).
# Rotate + move to GitHub Secrets before ever publishing to a store that requires private signing.
rockedit.storeFile=keystore/rockedit-release.jks
rockedit.storePassword=rockedit
rockedit.keyAlias=rockedit
rockedit.keyPassword=rockedit
